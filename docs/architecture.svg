<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">
  <title>FDE Tracker architecture: two repositories, web app on Vercel, API on Render, Supabase Postgres and Auth, 10:00 reminders</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <style>
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.2}
      .web{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.6}
      .api{fill:#ecfdf5;stroke:#047857;stroke-width:1.6}
      .db{fill:#fff7ed;stroke:#c2410c;stroke-width:1.6}
      .ext{fill:#f8fafc;stroke:#64748b;stroke-width:1.2;stroke-dasharray:5 4}
      .repo{fill:#f8f9fe;stroke:#000090;stroke-width:1.4}
      .h{font-weight:700;font-size:15px;fill:#0f172a}
      .s{fill:#334155}
      .m{fill:#64748b;font-size:12px}
      .ln{stroke:#334155;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .lnd{stroke:#334155;stroke-width:1.2;fill:none;stroke-dasharray:4 4;marker-end:url(#a)}
      .lab{fill:#0f172a;font-size:12px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">FDE Tracker (Programs V3): runtime architecture</text>
  <text x="30" y="60" class="m">Updated 2026-11-20: two repositories, per-program feed, task timesheet, 10:00 missed-status reminders, view-as roles, Classic / FiftyFive themes, in-app guide.</text>

  <!-- People -->
  <rect x="30" y="90" width="230" height="150" rx="10" class="box"/>
  <text x="48" y="116" class="h">People (browser, phone)</text>
  <text x="48" y="140" class="s">Admin: every program</text>
  <text x="48" y="160" class="s">Coordinator: runs a program</text>
  <text x="48" y="180" class="s">Member: fills daily status</text>
  <text x="48" y="204" class="m">One sign-in; "View as" steps down</text>
  <text x="48" y="222" class="m">Admin › Coordinator › Member</text>

  <!-- Web -->
  <rect x="320" y="90" width="400" height="250" rx="10" class="web"/>
  <text x="338" y="116" class="h">Web app · fde-tracker-appv2 · Vercel</text>
  <text x="338" y="138" class="m">React 18 + Vite + TypeScript, lazy pages, CSP in vercel.json</text>
  <text x="338" y="164" class="s">1. Choose a program (first screen)</text>
  <text x="338" y="184" class="s">2. Feed of that program · Plan (weeks fold)</text>
  <text x="338" y="204" class="s">3. Daily status = task timesheet (week / day)</text>
  <text x="338" y="224" class="s">4. Program status · Reports + Excel · Manage</text>
  <text x="338" y="248" class="s">Top bar: View as · Classic | 55 theme · Guide · Bell</text>
  <text x="338" y="268" class="s">Bell: reminders, alert card, desktop alerts</text>
  <text x="338" y="292" class="m">Hiding a link is convenience only:</text>
  <text x="338" y="310" class="m">the API checks the real role on every request.</text>

  <!-- Auth -->
  <rect x="780" y="90" width="390" height="90" rx="10" class="ext"/>
  <text x="798" y="116" class="h">Supabase Auth</text>
  <text x="798" y="140" class="s">Magic link sign-in, issues the JWT</text>
  <text x="798" y="160" class="m">Public key in the web app covers sign-in only</text>

  <!-- API -->
  <rect x="320" y="390" width="560" height="250" rx="10" class="api"/>
  <text x="338" y="416" class="h">API · fde-tracker-apiv2 · Render (Docker, .NET 10)</text>
  <text x="338" y="438" class="m">JWT check › approved › controller › service (per-program role, transaction) › repository (SQL)</text>
  <text x="338" y="466" class="s">/api/programs, plan, forms, members, invites</text>
  <text x="338" y="486" class="s">/api/programs/{id}/timesheet/{monday}   (tasks × days, hours + note)</text>
  <text x="338" y="506" class="s">/api/programs/{id}/daily · day-status · reports (+ .xlsx)</text>
  <text x="338" y="526" class="s">/api/feed?program_id=…   (only that program's people)</text>
  <text x="338" y="546" class="s">/api/notifications   (list, read, read-all)</text>
  <rect x="338" y="562" width="524" height="64" rx="8" fill="#fff" stroke="#047857" stroke-dasharray="4 3"/>
  <text x="352" y="584" class="lab">ReminderJob · every 5 min, acts at 10:00 IST on working days</text>
  <text x="352" y="604" class="m">Per person and program: no daily status and no timesheet hours on the previous working day</text>
  <text x="352" y="620" class="m">› one reminder (unique, safe to repeat) · catch-up when the app opens · filling the day clears it</text>

  <!-- DB -->
  <rect x="930" y="390" width="240" height="250" rx="10" class="db"/>
  <text x="948" y="416" class="h">Supabase Postgres</text>
  <text x="948" y="438" class="m">RLS on, public roles revoked</text>
  <text x="948" y="462" class="s">app_users</text>
  <text x="948" y="480" class="s">lp_programs · lp_members</text>
  <text x="948" y="498" class="s">lp_invites · lp_days</text>
  <text x="948" y="516" class="s">lp_form_fields</text>
  <text x="948" y="534" class="s">lp_daily_status · lp_day_status</text>
  <text x="948" y="552" class="s">lp_time_tasks · lp_time_cells</text>
  <text x="948" y="570" class="s">lp_time_weeks</text>
  <text x="948" y="588" class="s">feed_posts (+ program_id)</text>
  <text x="948" y="606" class="s">feed_likes · feed_comments</text>
  <text x="948" y="624" class="s">notifications</text>

  <!-- Email -->
  <rect x="30" y="460" width="230" height="110" rx="10" class="ext"/>
  <text x="48" y="486" class="h">Email (optional)</text>
  <text x="48" y="510" class="s">Resend free tier</text>
  <text x="48" y="530" class="m">On when RESEND_API_KEY and</text>
  <text x="48" y="548" class="m">EMAIL_FROM are set on Render</text>

  <!-- Repos / delivery -->
  <rect x="30" y="670" width="1140" height="70" rx="10" class="repo"/>
  <text x="48" y="696" class="h">Delivery</text>
  <text x="48" y="718" class="s">Branch › PR into develop › develop into main deploys (Vercel and Render) · CI: tsc + build + npm audit + gitleaks (web), 270+ xUnit tests + vulnerable packages (API) · AI agents with guardrails</text>

  <!-- Arrows -->
  <path d="M260 165 L318 165" class="ln"/><text x="266" y="156" class="lab">HTTPS</text>
  <path d="M720 135 L778 135" class="ln"/><text x="726" y="126" class="lab">sign in</text>
  <path d="M520 340 L520 388" class="ln"/><text x="528" y="370" class="lab">Bearer JWT · JSON (snake_case)</text>
  <path d="M880 515 L928 515" class="ln"/><text x="884" y="506" class="lab">SQL</text>
  <path d="M975 180 L975 388" class="lnd"/><text x="984" y="290" class="lab">signing keys (JWKS)</text>
  <path d="M338 600 L262 540" class="lnd"/><text x="270" y="600" class="lab">reminder email</text>
  <path d="M145 460 L145 242" class="lnd"/><text x="152" y="360" class="lab">inbox</text>
</svg>
